# Redis configuration for Docker deployment

# Network
bind 0.0.0.0
port 6379

# General
daemonize no
pidfile /var/run/redis_6379.pid

# Logging
loglevel notice
logfile ""

# Persistence
save 900 1
save 300 10
save 60 10000

# Security
# requirepass will be set via environment variable

# Memory
maxmemory-policy allkeys-lru

# Append only file
appendonly yes
appendfsync everysec

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128
