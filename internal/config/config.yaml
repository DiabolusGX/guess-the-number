# Sample configuration for Guess The Number Go Bot
deployment:
  mode: "local"

bot:
  token: "" # Token is loaded from .env file (GTN_BOT_TOKEN)
  dev_guilds: []
  sync_commands: false
  sharding:
    enabled: true # Set to true to enable sharding
    shard_count: 0 # 0 = auto-detect optimal shard count
    shard_ids: [] # empty = all shards, or specify like [0, 1] for specific shards
    auto_scaling: true # Enable automatic scaling based on guild count

mongo:
  host: ""
  username: ""
  password: ""
  database: ""
  params: "retryWrites=true&w=majority"
  max_pool_size: 10
  min_pool_size: 1

redis:
  host: "localhost"
  port: "6379"
  password: ""
  db: 0
  pool_size: 10

logging:
  level: "info"

sentry:
  enabled: false
  dsn: ""
  environment: "development"
  sample_rate: 1.0

metrics:
  enabled: true
  listen_addr: ":8080"

sync:
  enabled: true
  interval: 10s
  on_game_finish: true
  batch_size: 100
