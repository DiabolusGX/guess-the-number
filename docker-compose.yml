version: "3.8"

services:
    bot:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: guess-the-number-bot
        restart: unless-stopped
        env_file:
            - .env
        environment:
            # Override config paths for container
            - GTN_REDIS_HOST=${GTN_REDIS_HOST:-redis}
            # PM2 specific environment
            - PM2_HOME=/app/.pm2
            - NODE_ENV=production
        ports:
            - "${METRICS_PORT:-8080}:8080" # Metrics endpoint
            - "${PM2_WEB_PORT:-9615}:9615" # PM2 web interface (optional)
        # depends_on:
        #     - redis
        #     - mongo
        networks:
            - bot-network
        extra_hosts:
            - "host.docker.internal:host-gateway" # Allow access to host machine
        volumes:
            - ~/logs/gtn-bot:~/logs/gtn-bot # Mount host Promtail log path to container
            - pm2_data:/app/.pm2 # PM2 data persistence
        healthcheck:
            test: ["CMD", "sh", "-c", "pm2 list | grep -q 'online' || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        # Resource limits for production
        deploy:
            resources:
                limits:
                    cpus: "4.0"
                    memory: 4096M
                reservations:
                    cpus: "1.0"
                    memory: 1024M

    # Optional local Redis - can be removed if using remote Redis
    redis:
        image: redis:7.2-alpine
        container_name: guess-the-number-redis
        restart: unless-stopped
        environment:
            - REDIS_PASSWORD=${GTN_REDIS_PASSWORD:-}
        volumes:
            - redis_data:/data
            - ./docker/redis.conf:/etc/redis/redis.conf # Optional: custom Redis config
        ports:
            - "${REDIS_PORT:-6379}:6379"
        networks:
            - bot-network
        profiles:
            - local-db # Use profile to optionally include this service
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        command: >
            sh -c "
              if [ -n \"$$REDIS_PASSWORD\" ]; then
                redis-server --requirepass $$REDIS_PASSWORD
              else
                redis-server
              fi
            "

networks:
    bot-network:
        driver: bridge

volumes:
    redis_data:
        driver: local
    pm2_data:
        driver: local
