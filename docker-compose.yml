version: "3.8"

services:
    bot:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: guess-the-number-bot
        restart: unless-stopped
        env_file:
            - .env
        environment:
            # Override config paths for container
            - GTN_REDIS_HOST=${GTN_REDIS_HOST:-redis}
            - GTN_MONGO_HOST=${GTN_MONGO_HOST:-mongodb://mongo:27017}
        ports:
            - "${METRICS_PORT:-8080}:8080" # Metrics endpoint
        depends_on:
            - redis
            - mongo
        networks:
            - bot-network
        volumes:
            - ./logs:/app/logs # Optional: Mount logs directory
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/metrics"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    # Optional local MongoDB - can be removed if using remote MongoDB
    mongo:
        image: mongo:7.0
        container_name: guess-the-number-mongo
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${GTN_MONGO_USERNAME:-admin}
            MONGO_INITDB_ROOT_PASSWORD: ${GTN_MONGO_PASSWORD:-password}
            MONGO_INITDB_DATABASE: ${GTN_MONGO_DATABASE:-guess_the_number}
        volumes:
            - mongo_data:/data/db
            - ./docker/mongo-init:/docker-entrypoint-initdb.d # Optional: initialization scripts
        ports:
            - "${MONGO_PORT:-27017}:27017"
        networks:
            - bot-network
        profiles:
            - local-db # Use profile to optionally include this service

    # Optional local Redis - can be removed if using remote Redis
    redis:
        image: redis:7.2-alpine
        container_name: guess-the-number-redis
        restart: unless-stopped
        environment:
            - REDIS_PASSWORD=${GTN_REDIS_PASSWORD:-}
        volumes:
            - redis_data:/data
            - ./docker/redis.conf:/etc/redis/redis.conf # Optional: custom Redis config
        ports:
            - "${REDIS_PORT:-6379}:6379"
        networks:
            - bot-network
        profiles:
            - local-db # Use profile to optionally include this service
        command: >
            sh -c "
              if [ -n \"$$REDIS_PASSWORD\" ]; then
                redis-server --requirepass $$REDIS_PASSWORD
              else
                redis-server
              fi
            "

networks:
    bot-network:
        driver: bridge

volumes:
    mongo_data:
        driver: local
    redis_data:
        driver: local
